databaseChangeLog:
  - changeSet:
      id: 006-create-api-keys-table
      author: claude
      changes:
        - createTable:
            tableName: api_keys
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: key_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: key_prefix
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
              - column:
                  name: rate_limit_per_hour
                  type: INT
                  defaultValueNumeric: 1000
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: TIMESTAMP
              - column:
                  name: usage_count
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  defaultValue: 'system'
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  defaultValue: 'system'
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: api_keys
            constraintName: fk_api_keys_user
            referencedColumnNames: id
            referencedTableName: users
            onDelete: CASCADE
            onUpdate: CASCADE

        - createIndex:
            indexName: idx_api_keys_key_hash
            tableName: api_keys
            unique: true
            columns:
              - column:
                  name: key_hash

        - createIndex:
            indexName: idx_api_keys_user_id
            tableName: api_keys
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_api_keys_active
            tableName: api_keys
            columns:
              - column:
                  name: active

      rollback:
        - dropTable:
            tableName: api_keys

  - changeSet:
      id: 006-create-api-key-usage-logs-table
      author: claude
      changes:
        - createTable:
            tableName: api_key_usage_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: api_key_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: endpoint
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: http_method
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: client_ip
                  type: VARCHAR(45)
                  constraints:
                    nullable: false
              - column:
                  name: response_status
                  type: INT
              - column:
                  name: response_time_ms
                  type: BIGINT
              - column:
                  name: requested_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseColumnNames: api_key_id
            baseTableName: api_key_usage_logs
            constraintName: fk_api_key_usage_logs_key
            referencedColumnNames: id
            referencedTableName: api_keys
            onDelete: CASCADE
            onUpdate: CASCADE

        - createIndex:
            indexName: idx_api_key_usage_logs_api_key_id
            tableName: api_key_usage_logs
            columns:
              - column:
                  name: api_key_id

        - createIndex:
            indexName: idx_api_key_usage_logs_requested_at
            tableName: api_key_usage_logs
            columns:
              - column:
                  name: requested_at

        - sql:
            sql: CREATE INDEX idx_api_key_usage_logs_key_date ON api_key_usage_logs(api_key_id, requested_at);

      rollback:
        - dropTable:
            tableName: api_key_usage_logs
